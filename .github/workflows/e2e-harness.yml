name: E2E harness

# The managed E2E stack needs KVM, containers and a prepared host, so
# e2e-local.yml keeps running the integration suite. This job covers the
# lifecycle and evidence code that must not regress silently: it needs only
# Python and runs in under a minute.

on:
  push:
    branches: [main]
    paths:
      - 'apps/e2e/**'
      - 'apps/box-images/VERSION'
      - 'scripts/test/rest/**'
      - 'tests/scripts/**'
      - 'make/test.mk'
      - 'make/help.mk'
      - '.github/workflows/e2e-harness.yml'
  pull_request:
    paths:
      - 'apps/e2e/**'
      - 'apps/box-images/VERSION'
      - 'scripts/test/rest/**'
      - 'tests/scripts/**'
      - 'make/test.mk'
      - 'make/help.mk'
      - '.github/workflows/e2e-harness.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned pytest
        run: |
          set -euo pipefail
          requirement=$(python3 - <<'PY'
          import tomllib
          with open("apps/e2e/pyproject.toml", "rb") as stream:
              dependencies = tomllib.load(stream)["project"]["dependencies"]
          print(next(item for item in dependencies if item.startswith("pytest==")))
          PY
          )
          python3 -m pip install "$requirement"
      - name: Run harness checks
        run: make test:e2e:check
